<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Admin | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --sidebar: #1e293b; --bg: #f1f5f9; --blue: #3b82f6; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; }
        .brand { font-size: 20px; font-weight: 800; margin-bottom: 40px; color: white; }
        .brand span { color: var(--blue); }
        .menu-item { padding: 15px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 15px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .menu-item:hover, .menu-item.active { background: #334155; color: white; }
        .logout { margin-top: auto; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* Content */
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
        
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h3 { font-size: 32px; margin: 0; color: #1e293b; }
        .card p { color: #64748b; font-size: 14px; margin-top: 5px; }
        .card-icon { font-size: 24px; margin-bottom: 15px; color: var(--blue); }
    </style>
</head>
<body>

   <!-- UPDATED SIDEBAR -->
    <div class="sidebar">
        <div class="brand">BharatKart <span>Admin</span></div>
        
        <!-- Links to real pages -->
        <a href="dashboard.html" class="menu-item active" style="text-decoration: none;">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>
        
        <a href="products.html" class="menu-item" style="text-decoration: none;">
            <i class="fa-solid fa-box"></i> Products
        </a>
        
        <a href="orders.html" class="menu-item" style="text-decoration: none;">
            <i class="fa-solid fa-cart-shopping"></i> Orders
        </a>
        
        <a href="customers.html" class="menu-item" style="text-decoration: none;">
            <i class="fa-solid fa-users"></i> Customers
        </a>
        <a href="coupons.html" class="menu-item"><i class="fa-solid fa-ticket"></i> Coupons</a>

        <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="header">
            <h1>Dashboard Overview</h1>
            <div style="text-align: right;">
                <h4 style="margin:0;" id="adminName">Loading...</h4>
                <small style="color:green;">● Live Data</small>
            </div>
        </div>

        <!-- LIVE STATS -->
        <div class="stats">
            <!-- Users -->
            <div class="card">
                <i class="fa-solid fa-users card-icon"></i>
                <h3 id="userCount">...</h3>
                <p>Total Users</p>
            </div>
            
            <!-- Orders -->
            <div class="card">
                <i class="fa-solid fa-cart-shopping card-icon" style="color: orange;"></i>
                <h3 id="orderCount">...</h3>
                <p>Total Orders</p>
            </div>
            
            <!-- Revenue -->
            <div class="card">
                <i class="fa-solid fa-indian-rupee-sign card-icon" style="color: green;"></i>
                <h3 id="totalRevenue">...</h3>
                <p>Total Revenue</p>
            </div>
            
            <!-- Pending -->
            <div class="card">
                <i class="fa-solid fa-clock card-icon" style="color: purple;"></i>
                <h3 id="pendingOrders">...</h3>
                <p>Pending Orders</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. SECURE CHECK & LOAD DATA
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    // Check Admin Role
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    
                    if (userDoc.exists() && userDoc.data().role === "admin") {
                        document.getElementById('adminName').innerText = user.email;
                        
                        // ✅ FETCH REAL DATA
                        fetchDashboardStats();
                    } else {
                        alert("⛔ Access Denied");
                        await signOut(auth);
                        window.location.href = "index.html";
                    }
                } catch (error) {
                    console.error("Auth Error", error);
                }
            } else {
                window.location.href = "index.html";
            }
        });

        // 2. FETCH STATS FUNCTION
        async function fetchDashboardStats() {
            try {
                // A. Get Users Count
                const usersSnap = await getDocs(collection(db, "users"));
                document.getElementById("userCount").innerText = usersSnap.size;

                // B. Get Orders Data
                const ordersSnap = await getDocs(collection(db, "orders"));
                
                let totalOrders = ordersSnap.size;
                let revenue = 0;
                let pending = 0;

                ordersSnap.forEach(doc => {
                    const data = doc.data();
                    
                    // Calculate Revenue (Sum of 'amount')
                    if(data.amount) {
                        revenue += parseInt(data.amount);
                    }

                    // Count Pending Orders
                    if(data.status === "Placed") {
                        pending++;
                    }
                });

                // Update UI
                document.getElementById("orderCount").innerText = totalOrders;
                document.getElementById("totalRevenue").innerText = "₹ " + revenue.toLocaleString();
                document.getElementById("pendingOrders").innerText = pending;

            } catch (error) {
                console.error("Error fetching stats:", error);
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
