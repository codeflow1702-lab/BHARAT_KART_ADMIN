<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Admin | Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --sidebar: #1e293b; --bg: #f1f5f9; --blue: #3b82f6; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); }

        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; }
        .brand { font-size: 20px; font-weight: 800; margin-bottom: 40px; color: white; }
        .menu-item { padding: 15px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 15px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: #334155; color: white; }
        .logout { margin-top: auto; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        .content { flex: 1; padding: 40px; overflow-y: auto; }
        
        /* Form */
        .add-product-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr 1fr auto auto; gap: 15px; align-items: end; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #64748b; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; }
        
        .btn { color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; height: 40px; }
        .add-btn { background: var(--blue); }
        .cancel-btn { background: #64748b; display: none; } /* Hidden by default */

        /* Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .product-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        .product-img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
        .product-info { padding: 15px; }
        
        /* Action Buttons */
        .actions { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .icon-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .del-btn { background: rgba(255, 0, 0, 0.8); }
        .edit-btn { background: rgba(0, 0, 255, 0.8); }

/* =========================================
   PROFESSIONAL PRODUCT IMAGE MANAGER
   ========================================= */

.image-manager {
    background: #fafafa;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    padding: 18px;
    margin-top: 8px;
}

.image-manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.image-manager-header h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #222;
}

.image-manager-header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #888;
}

.add-image-btn {
    border: none;
    background: #1e1e1e;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: 0.2s ease;
    white-space: nowrap;
}

.add-image-btn:hover {
    transform: translateY(-1px);
    background: #333;
}

.add-image-btn:active {
    transform: scale(0.97);
}

/* Gallery */

.image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}

.empty-gallery {
    grid-column: 1 / -1;
    min-height: 140px;
    border: 2px dashed #ddd;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    background: white;
}

.empty-gallery i {
    font-size: 30px;
    margin-bottom: 8px;
    color: #bbb;
}

.empty-gallery span {
    font-size: 14px;
    font-weight: 600;
    color: #777;
}

.empty-gallery small {
    margin-top: 4px;
    font-size: 11px;
    color: #aaa;
}

/* Image Card */

.image-item {
    position: relative;
    height: 120px;
    border-radius: 12px;
    overflow: hidden;
    background: #eee;
    border: 1px solid #ddd;
}

.image-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Main image badge */

.image-main-badge {
    position: absolute;
    left: 7px;
    bottom: 7px;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
}

/* Remove button */

.remove-image-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 27px;
    height: 27px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    color: #e53935;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: 0.2s ease;
}

.remove-image-btn:hover {
    background: #e53935;
    color: white;
    transform: scale(1.08);
}

/* Set main image button */

.set-main-btn {
    position: absolute;
    left: 7px;
    top: 7px;
    border: none;
    background: rgba(255,255,255,0.92);
    color: #555;
    padding: 5px 7px;
    border-radius: 6px;
    font-size: 10px;
    cursor: pointer;
    font-weight: 600;
}

.set-main-btn:hover {
    background: #1e1e1e;
    color: white;
}

/* Mobile */

@media (max-width: 600px) {

    .image-manager {
        padding: 14px;
    }

    .image-manager-header {
        align-items: flex-start;
    }

    .image-manager-header h3 {
        font-size: 15px;
    }

    .add-image-btn {
        padding: 9px 12px;
        font-size: 12px;
    }

    .image-gallery {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .image-item {
        height: 95px;
    }

    .empty-gallery {
        min-height: 120px;
    }
                   }
        
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">BharatKart <span>Admin</span></div>
        <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="products.html" class="menu-item active"><i class="fa-solid fa-box"></i> Products</a>
        <a href="orders.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
        <a href="customers.html" class="menu-item"><i class="fa-solid fa-users"></i> Customers</a>
        <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div class="content">
        <h1>Product Management</h1>

        <!-- FORM -->
        <div class="add-product-card">
            <input type="hidden" id="prodId"> <!-- Hidden ID for editing -->
            
            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="prodName" placeholder="e.g. Aloe Vera">
            </div>
            <div class="form-group">
                <label>Price (₹)</label>
                <input type="number" id="prodPrice" placeholder="e.g. 500">
            </div>
            <div class="form-group">
    <label>Product Images</label>

    <div class="image-manager">

        <div class="image-manager-header">
            <div>
                <h3>Product Gallery</h3>
                <p>Add multiple images for this product</p>
            </div>

            <button type="button" class="add-image-btn" id="addImageBtn">
                <i class="fas fa-plus"></i>
                Add Image
            </button>
        </div>

        <div class="image-gallery" id="imageGallery">
            <div class="empty-gallery" id="emptyGallery">
                <i class="fas fa-images"></i>
                <span>No images added</span>
                <small>Add an image URL to get started</small>
            </div>
        </div>

        <!-- Hidden field kept for the existing product system -->
        <input type="hidden" id="prodImg">

        <!-- Stores all gallery image URLs -->
        <input type="hidden" id="prodImages">

    </div>
            </div>
            
            <button class="btn add-btn" id="mainBtn" onclick="saveProduct()">+ Add Product</button>
            <button class="btn cancel-btn" id="cancelBtn" onclick="resetForm()">Cancel</button>
        </div>

        <!-- LIST -->
        <div class="product-grid" id="productContainer">
            <p>Loading products...</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "index.html";
            else loadProducts();
        });

        // 1. SAVE PRODUCT (ADD OR UPDATE)
        window.saveProduct = async () => {
            const id = document.getElementById('prodId').value;
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const img = document.getElementById('prodImg').value;

            if(!name || !price || !img) { alert("Please fill all fields"); return; }

            try {
                if (id) {
                    // UPDATE EXISTING
                    await updateDoc(doc(db, "products", id), {
                        name: name,
                        price: Number(price),
                        image: img
                    });
                    alert("Product Updated! ✅");
                } else {
                    // ADD NEW
                    await addDoc(collection(db, "products"), {
                        name: name,
                        price: Number(price),
                        image: img
                    });
                    alert("Product Added! ✅");
                }
                resetForm();
                loadProducts();
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        // 2. LOAD PRODUCTS
        async function loadProducts() {
            const container = document.getElementById('productContainer');
            container.innerHTML = "Loading...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = "";

                if(querySnapshot.empty) {
                    container.innerHTML = "<p>No products found.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const prod = doc.data();
                    // Note: Passing data to edit function carefully
                    const html = `
                        <div class="product-card">
                            <div class="actions">
                                <button class="icon-btn edit-btn" onclick="editProduct('${doc.id}', '${prod.name}', '${prod.price}', '${prod.image}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="icon-btn del-btn" onclick="deleteProduct('${doc.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <img src="${prod.image}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="product-info">
                                <h4>${prod.name}</h4>
                                <p>₹ ${prod.price}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // 3. EDIT MODE
        window.editProduct = (id, name, price, img) => {
            document.getElementById('prodId').value = id;
            document.getElementById('prodName').value = name;
            document.getElementById('prodPrice').value = price;
            document.getElementById('prodImg').value = img;

            document.getElementById('mainBtn').innerText = "Update Product";
            document.getElementById('mainBtn').style.background = "orange";
            document.getElementById('cancelBtn').style.display = "block";
        };

        // 4. RESET FORM
        window.resetForm = () => {
            document.getElementById('prodId').value = "";
            document.getElementById('prodName').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodImg').value = "";

            document.getElementById('mainBtn').innerText = "+ Add Product";
            document.getElementById('mainBtn').style.background = "#3b82f6";
            document.getElementById('cancelBtn').style.display = "none";
        };

        // 5. DELETE
        window.deleteProduct = async (id) => {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
