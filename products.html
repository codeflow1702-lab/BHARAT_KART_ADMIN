/* =========================================
   PROFESSIONAL PRODUCT IMAGE MANAGER
   ========================================= */

.image-manager {
    background: #fafafa;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    padding: 18px;
    margin-top: 8px;
}

.image-manager-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 18px;
}

.image-manager-header h3 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #222;
}

.image-manager-header p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #888;
}

.add-image-btn {
    border: none;
    background: #1e1e1e;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: 0.2s ease;
    white-space: nowrap;
}

.add-image-btn:hover {
    transform: translateY(-1px);
    background: #333;
}

.add-image-btn:active {
    transform: scale(0.97);
}

/* Gallery */

.image-gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
}

.empty-gallery {
    grid-column: 1 / -1;
    min-height: 140px;
    border: 2px dashed #ddd;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: #999;
    background: white;
}

.empty-gallery i {
    font-size: 30px;
    margin-bottom: 8px;
    color: #bbb;
}

.empty-gallery span {
    font-size: 14px;
    font-weight: 600;
    color: #777;
}

.empty-gallery small {
    margin-top: 4px;
    font-size: 11px;
    color: #aaa;
}

/* Image Card */

.image-item {
    position: relative;
    height: 120px;
    border-radius: 12px;
    overflow: hidden;
    background: #eee;
    border: 1px solid #ddd;
}

.image-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Main image badge */

.image-main-badge {
    position: absolute;
    left: 7px;
    bottom: 7px;
    background: rgba(0, 0, 0, 0.75);
    color: white;
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
}

/* Remove button */

.remove-image-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 27px;
    height: 27px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    color: #e53935;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    transition: 0.2s ease;
}

.remove-image-btn:hover {
    background: #e53935;
    color: white;
    transform: scale(1.08);
}

/* Set main image button */

.set-main-btn {
    position: absolute;
    left: 7px;
    top: 7px;
    border: none;
    background: rgba(255,255,255,0.92);
    color: #555;
    padding: 5px 7px;
    border-radius: 6px;
    font-size: 10px;
    cursor: pointer;
    font-weight: 600;
}

.set-main-btn:hover {
    background: #1e1e1e;
    color: white;
}

/* Mobile */

@media (max-width: 600px) {

    .image-manager {
        padding: 14px;
    }

    .image-manager-header {
        align-items: flex-start;
    }

    .image-manager-header h3 {
        font-size: 15px;
    }

    .add-image-btn {
        padding: 9px 12px;
        font-size: 12px;
    }

    .image-gallery {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .image-item {
        height: 95px;
    }

    .empty-gallery {
        min-height: 120px;
    }
                   }

/* =========================================
   IMAGE URL FORM
   ========================================= */

.image-modal-overlay {

.image-modal-box {

/* =========================================
   PRODUCT IMAGE MANAGER
   ========================================= */

let productImages = [];

                    }
                </p>

            </div>

            <button
                type="button"
                class="image-modal-close"
                id="dynamicCloseImageModal"
            >
                <i class="fas fa-xmark"></i>
            </button>

        </div>


        <div class="image-url-form">

            ${
                isGallery
                ? `
                    <textarea
                        id="imageUrlInput"
                        class="image-url-input image-url-textarea"
                        placeholder="https://example.com/image1.jpg
https://example.com/image2.jpg
https://example.com/image3.jpg"
                    ></textarea>

                    <small class="image-input-help">
                        Add one image URL per line
                    </small>
                `
                : `
                    <input
                        type="url"
                        id="imageUrlInput"
                        class="image-url-input"
                        placeholder="https://example.com/product.jpg"
                    >

                    <small class="image-input-help">
                        Use a direct image URL ending in .jpg, .png, .webp, etc.
                    </small>
                `
            }

        </div>


        <div class="image-modal-actions">

            <button
                type="button"
                class="image-back-btn"
                id="imageBackBtn"
            >
                <i class="fas fa-arrow-left"></i>
                Back
            </button>

            <button
                type="button"
                class="image-add-confirm-btn"
                id="confirmImageBtn"
            >
                <i class="fas fa-plus"></i>
                Add Image${isGallery ? "s" : ""}
            </button>

        </div>

    `;


    /* Close */

}

/* =========================================
   ADD IMAGE URLS
   ========================================= */

function addImageUrls(isGallery) {

    const input = document.getElementById("imageUrlInput");

    if (!input) return;

    let urls = [];

    if (isGallery) {

        urls = input.value
            .split("\n")
            .map(url => url.trim())
            .filter(url => url !== "");

    } else {

        const url = input.value.trim();

        if (url) {
            urls.push(url);
        }

    }


    if (urls.length === 0) {

        alert("Please enter at least one image URL.");

        return;

    }


    /* Add images */

    urls.forEach(url => {

        if (!productImages.includes(url)) {

            productImages.push(url);

        }

    });


    updateImageFields();

    renderImageGallery();

    closeImageModal();

}


/* =========================================
   RENDER IMAGE GALLERY
   ========================================= */

function renderImageGallery() {

    const gallery = document.getElementById("imageGallery");

    const empty = document.getElementById("emptyGallery");


    if (!gallery) return;


    if (productImages.length === 0) {

        gallery.innerHTML = `

            <div class="empty-gallery" id="emptyGallery">

                <i class="fas fa-images"></i>

                <span>No images added</span>

                <small>Add an image URL to get started</small>

            </div>

        `;

        return;

    }


    gallery.innerHTML = "";


    productImages.forEach((url, index) => {

        const item = document.createElement("div");

        item.className = "image-item";


        item.innerHTML = `

            <img
                src="${url}"
                onerror="this.style.opacity='0.25'"
            >


            ${
                index === 0
                ? `
                    <div class="image-main-badge">
                        <i class="fas fa-star"></i>
                        Main Image
                    </div>
                `
                : `
                    <button
                        type="button"
                        class="set-main-btn"
                        data-index="${index}"
                    >
                        Set Main
                    </button>
                `
            }


            <button
                type="button"
                class="remove-image-btn"
                data-index="${index}"
                title="Remove image"
            >
                <i class="fas fa-xmark"></i>
            </button>

        `;


        gallery.appendChild(item);

    });


    /* Remove buttons */

    gallery
        .querySelectorAll(".remove-image-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                const index = Number(button.dataset.index);

                productImages.splice(index, 1);

                updateImageFields();

                renderImageGallery();

            });

        });


    /* Main image buttons */

    gallery
        .querySelectorAll(".set-main-btn")
        .forEach(button => {

            button.addEventListener("click", () => {

                const index = Number(button.dataset.index);

                const selected = productImages.splice(index, 1)[0];

                productImages.unshift(selected);

                updateImageFields();

                renderImageGallery();

            });

        });

}


/* =========================================
   UPDATE HIDDEN FIELDS
   ========================================= */

function updateImageFields() {

    const mainImage = productImages.length > 0
        ? productImages[0]
        : "";


    document.getElementById("prodImg").value = mainImage;


    document.getElementById("prodImages").value =
        JSON.stringify(productImages);

}


/* =========================================
   INITIALIZE
   ========================================= */

renderImageGallery();


        // 1. SAVE PRODUCT (ADD OR UPDATE)
        window.saveProduct = async () => {
            const id = document.getElementById('prodId').value;
            const name = document.getElementById('prodName').value;
            const price = document.getElementById('prodPrice').value;
            const img = document.getElementById('prodImg').value;

            if(!name || !price || !img) { alert("Please fill all fields"); return; }

            try {
                if (id) {
                    // UPDATE EXISTING
                    await updateDoc(doc(db, "products", id), {
    name: name,
    price: Number(price),
    image: img,
    images: productImages
});
                    alert("Product Updated! ✅");
                } else {
                    // ADD NEW
                    await addDoc(collection(db, "products"), {
    name: name,
    price: Number(price),
    image: img,
    images: productImages
});
                    alert("Product Added! ✅");
                }
                resetForm();
                loadProducts();
            } catch (error) {
                alert("Error: " + error.message);
            }
        };

        // 2. LOAD PRODUCTS
        async function loadProducts() {
            const container = document.getElementById('productContainer');
            container.innerHTML = "Loading...";
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = "";

                if(querySnapshot.empty) {
                    container.innerHTML = "<p>No products found.</p>";
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const prod = doc.data();
                    // Note: Passing data to edit function carefully
                    const html = `
                        <div class="product-card">
                            <div class="actions">
                                <button class="icon-btn edit-btn" onclick="editProduct('${doc.id}', '${prod.name}', '${prod.price}', '${prod.image}')"><i class="fa-solid fa-pen"></i></button>
                                <button class="icon-btn del-btn" onclick="deleteProduct('${doc.id}')"><i class="fa-solid fa-trash"></i></button>
                            </div>
                            <img src="${prod.image}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
                            <div class="product-info">
                                <h4>${prod.name}</h4>
                                <p>₹ ${prod.price}</p>
                            </div>
                        </div>
                    `;
                    container.innerHTML += html;
                });
            } catch (error) {
                console.error(error);
            }
        }

        // 3. EDIT MODE
        window.editProduct = async (id, name, price, img) => {
    document.getElementById('prodId').value = id;
    document.getElementById('prodName').value = name;
    document.getElementById('prodPrice').value = price;

    const productDoc = await getDocs(collection(db, "products"));
    const found = productDoc.docs.find(d => d.id === id);

    if (found) {
        const data = found.data();

        productImages = Array.isArray(data.images)
            ? [...data.images]
            : (data.image ? [data.image] : []);

        updateImageFields();
        renderImageGallery();
    }

    document.getElementById('mainBtn').innerText = "Update Product";
    document.getElementById('mainBtn').style.background = "orange";
    document.getElementById('cancelBtn').style.display = "block";
};

        // 4. RESET FORM
        window.resetForm = () => {
            document.getElementById('prodId').value = "";
            document.getElementById('prodName').value = "";
            document.getElementById('prodPrice').value = "";
            document.getElementById('prodImg').value = "";

            document.getElementById('mainBtn').innerText = "+ Add Product";
            document.getElementById('mainBtn').style.background = "#3b82f6";
            document.getElementById('cancelBtn').style.display = "none";
        };

        // 5. DELETE
        window.deleteProduct = async (id) => {
            if(confirm("Delete this product?")) {
                await deleteDoc(doc(db, "products", id));
                loadProducts();
            }
        };

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
