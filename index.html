<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Admin | Secure Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: white;
            /* ADVANCED ANIMATED BACKGROUND */
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f172a, #3b82f6);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* GLASSMORPHISM CARD */
        .login-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            transform: translateY(0);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        h2 { margin: 0 0 10px; font-weight: 800; letter-spacing: 1px; font-size: 28px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 40px; }

        .input-group { position: relative; margin-bottom: 20px; }
        
        input {
            width: 100%;
            padding: 15px;
            padding-right: 45px; /* Space for eye icon */
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input:focus { border-color: #3b82f6; background: rgba(0, 0, 0, 0.5); }

        /* EYE ICON */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            transition: 0.3s;
        }
        .toggle-password:hover { color: white; }

        button {
            width: 100%;
            padding: 15px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }

        button:hover { background: #2563eb; box-shadow: 0 0 25px rgba(59, 130, 246, 0.8); transform: scale(1.02); }

        .error {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 20px;
            display: none;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ADMIN <span style="color:#3b82f6">PORTAL</span></h2>
        <p>Secure Access Control System</p>

        <div class="input-group">
            <input type="email" id="email" placeholder="admin@bharatkart.com">
        </div>
        
        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
            <i class="fa-solid fa-eye-slash toggle-password" onclick="togglePass()"></i>
        </div>
        
        <button onclick="handleLogin()" id="loginBtn">AUTHENTICATE</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 👁️ PASSWORD TOGGLE FUNCTION
        window.togglePass = () => {
            const passInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (passInput.type === "password") {
                passInput.type = "text";
                icon.classList.replace("fa-eye-slash", "fa-eye");
            } else {
                passInput.type = "password";
                icon.classList.replace("fa-eye", "fa-eye-slash");
            }
        };

        window.handleLogin = async () => {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const errorMsg = document.getElementById("errorMsg");
            const btn = document.getElementById("loginBtn");

            errorMsg.style.display = "none";
            btn.innerText = "VERIFYING...";
            btn.style.opacity = "0.7";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Check Admin Role
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists() && docSnap.data().role === "admin") {
                    window.location.href = "dashboard.html";
                } else {
                    await signOut(auth);
                    throw new Error("Access Denied: Admin privileges required.");
                }
            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.style.display = "block";
                btn.innerText = "AUTHENTICATE";
                btn.style.opacity = "1";
            }
        };
    </script>
</body>
</html>
