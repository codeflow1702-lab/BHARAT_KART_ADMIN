<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Admin | Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root { --sidebar: #1e293b; --bg: #f1f5f9; --blue: #3b82f6; }
        body { margin: 0; display: flex; height: 100vh; font-family: 'Inter', sans-serif; background: var(--bg); }

        /* Sidebar (Same as Dashboard) */
        .sidebar { width: 260px; background: var(--sidebar); color: white; padding: 25px; display: flex; flex-direction: column; }
        .brand { font-size: 20px; font-weight: 800; margin-bottom: 40px; color: white; }
        .brand span { color: var(--blue); }
        .menu-item { padding: 15px; color: #94a3b8; cursor: pointer; display: flex; align-items: center; gap: 15px; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; text-decoration: none; }
        .menu-item:hover, .menu-item.active { background: #334155; color: white; }
        .logout { margin-top: auto; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; }

        /* Content */
        .content { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { color: #1e293b; }

        /* ORDERS TABLE */
        .orders-table { width: 100%; background: white; border-radius: 12px; border-collapse: collapse; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .orders-table th { background: #f8fafc; text-align: left; padding: 15px; color: #64748b; font-size: 13px; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .orders-table td { padding: 15px; border-bottom: 1px solid #e2e8f0; color: #334155; font-size: 14px; vertical-align: top; }
        .orders-table tr:last-child td { border-bottom: none; }

        /* Status Badges */
        .status-select { padding: 5px 10px; border-radius: 6px; border: 1px solid #cbd5e1; background: white; cursor: pointer; font-size: 12px; font-weight: 600; }
        .status-placed { color: #d97706; border-color: #d97706; }
        .status-shipped { color: #2563eb; border-color: #2563eb; }
        .status-delivered { color: #16a34a; border-color: #16a34a; }

        .item-list { list-style: none; padding: 0; margin: 0; font-size: 13px; color: #64748b; }
        .item-list li { margin-bottom: 2px; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">BharatKart <span>Admin</span></div>
        <a href="dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="products.html" class="menu-item"><i class="fa-solid fa-box"></i> Products</a>
        <a href="orders.html" class="menu-item active"><i class="fa-solid fa-cart-shopping"></i> Orders</a>
        <a href="customers.html" class="menu-item"><i class="fa-solid fa-users"></i> Customers</a>
        <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="content">
        <div class="header">
            <h1>Order Management</h1>
            <button onclick="fetchOrders()" style="padding: 8px 15px; background: white; border: 1px solid #ccc; cursor: pointer; border-radius: 5px;">Refresh <i class="fa-solid fa-rotate-right"></i></button>
        </div>

        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Customer</th>
                    <th>Items</th>
                    <th>Amount</th>
                    <th>Address</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="ordersBody">
                <!-- Orders will load here -->
                <tr><td colspan="6" style="text-align:center;">Loading orders...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- FIREBASE LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 1. AUTH CHECK
        onAuthStateChanged(auth, (user) => {
            if (!user) window.location.href = "index.html";
            else fetchOrders(); // Load orders if logged in
        });

        // 2. FETCH ORDERS
        window.fetchOrders = async () => {
            const tbody = document.getElementById("ordersBody");
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Loading...</td></tr>';

            try {
                // Get orders sorted by time (newest first) - requires index, but basic fetch works too
                const q = query(collection(db, "orders")); 
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No orders found.</td></tr>';
                    return;
                }

                tbody.innerHTML = ""; // Clear loading

                querySnapshot.forEach((docSnap) => {
                    const order = docSnap.data();
                    const orderId = docSnap.id;
                    
                    // Safely get shipping information
const shipping = order.shipping || {};

const customerName = shipping.name || "Guest Customer";
const phone = shipping.phone || "N/A";
const address = shipping.address || "N/A";
const city = shipping.city || "";
const pincode = shipping.pincode || "";

// Safely format items
let itemsHtml = `<ul class="item-list">`;

if (Array.isArray(order.items) && order.items.length > 0) {
    order.items.forEach(item => {
        const itemName = item?.name || "Unknown Product";
        const itemPrice = Number(item?.price) || 0;
        const itemQuantity = Number(item?.quantity) || 1;

        itemsHtml += `<li>• ${itemName} × ${itemQuantity} (₹${itemPrice})</li>`;
    });
} else {
    itemsHtml += `<li>No items</li>`;
}

itemsHtml += `</ul>`;

// Status Dropdown
const currentStatus = order.status || "Placed";

const statusOptions = `
    <select onchange="updateStatus('${orderId}', this.value)" class="status-select">
        <option value="Placed" ${currentStatus === 'Placed' ? 'selected' : ''}>Placed</option>
        <option value="Shipped" ${currentStatus === 'Shipped' ? 'selected' : ''}>Shipped</option>
        <option value="Delivered" ${currentStatus === 'Delivered' ? 'selected' : ''}>Delivered</option>
    </select>
`;

const row = `
    <tr>
        <td><small>#${orderId.slice(0,6)}</small></td>

        <td>
            <strong>${customerName}</strong><br>
            <small>${phone}</small>
        </td>

        <td>${itemsHtml}</td>

        <td>
            <strong>₹${order.amount || 0}</strong>
        </td>

        <td>
            <small>
                ${address}
                ${city ? `, ${city}` : ''}
                ${pincode ? ` - ${pincode}` : ''}
            </small>
        </td>

        <td>${statusOptions}</td>
    </tr>
`;
                    tbody.innerHTML += row;
                });

            } catch (error) {
                console.error("Error:", error);
                tbody.innerHTML = `<tr><td colspan="6" style="color:red; text-align:center;">Error loading orders: ${error.message}</td></tr>`;
            }
        };

        // 3. UPDATE STATUS FUNCTION
        window.updateStatus = async (orderId, newStatus) => {
            try {
                const orderRef = doc(db, "orders", orderId);
                await updateDoc(orderRef, {
                    status: newStatus
                });
                alert(`Order #${orderId.slice(0,6)} updated to ${newStatus} ✅`);
            } catch (error) {
                alert("Error updating status: " + error.message);
            }
        };

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "index.html");
        });
    </script>
</body>
</html>
