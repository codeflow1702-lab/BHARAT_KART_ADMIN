<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatKart Admin | Customers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --sidebar: #1e293b;
            --bg: #f1f5f9;
            --blue: #3b82f6;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            display: flex;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #1e293b;
        }

        .sidebar {
            width: 260px;
            min-width: 260px;
            background: var(--sidebar);
            color: white;
            padding: 25px;
            display: flex;
            flex-direction: column;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 40px;
            color: white;
        }

        .brand span { color: var(--blue); }

        .menu-item {
            padding: 15px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 8px;
            transition: 0.3s;
            margin-bottom: 5px;
            text-decoration: none;
        }

        .menu-item:hover,
        .menu-item.active {
            background: #334155;
            color: white;
        }

        .logout {
            margin-top: auto;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;
            font-size: 30px;
        }

        .admin-info {
            text-align: right;
        }

        .admin-info h4 {
            margin: 0;
            font-size: 14px;
        }

        .live {
            color: green;
            font-size: 12px;
        }

        .toolbar {
            background: white;
            padding: 18px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            flex: 1;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            font-family: inherit;
        }

        .search-box input:focus {
            border-color: var(--blue);
        }

        .refresh-btn {
            border: none;
            background: var(--blue);
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .customer-count {
            color: #64748b;
            font-size: 13px;
            white-space: nowrap;
        }

        .customer-list {
            display: grid;
            gap: 15px;
        }

        .customer-card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: 18px;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: #dbeafe;
            color: #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
        }

        .customer-main h3 {
            margin: 0 0 5px;
            font-size: 17px;
        }

        .customer-main p {
            margin: 3px 0;
            color: #64748b;
            font-size: 13px;
            word-break: break-word;
        }

        .customer-role {
            display: inline-block;
            margin-top: 6px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #dcfce7;
            color: #15803d;
            font-size: 11px;
            font-weight: 700;
        }

        .view-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .view-btn:hover {
            background: #dbeafe;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: #64748b;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .empty i {
            font-size: 35px;
            margin-bottom: 10px;
            color: #94a3b8;
        }

        /* Customer details modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show { display: flex; }

        .modal-box {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 21px;
        }

        .close-btn {
            border: none;
            background: #f1f5f9;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        .detail-row {
            padding: 13px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            display: block;
            color: #64748b;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .detail-value {
            font-size: 14px;
            font-weight: 600;
            word-break: break-word;
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 90px;
                min-width: 90px;
                padding: 15px 10px;
            }

            .brand {
                font-size: 13px;
                text-align: center;
                margin-bottom: 25px;
            }

            .brand span { display: none; }

            .menu-item {
                justify-content: center;
                padding: 13px 8px;
            }

            .menu-item i { font-size: 18px; }

            .menu-item {
                font-size: 0;
            }

            .logout {
                font-size: 0;
            }

            .logout::before {
                content: "↪";
                font-size: 20px;
            }

            .content {
                padding: 20px 15px;
            }

            .header {
                align-items: flex-start;
            }

            .header h1 {
                font-size: 23px;
            }

            .admin-info {
                display: none;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .customer-count {
                white-space: normal;
            }

            .customer-card {
                grid-template-columns: auto 1fr;
            }

            .view-btn {
                grid-column: 1 / -1;
                width: 100%;
            }
        }
    </style>
<link rel="stylesheet" href="../../assets/bharatkart-ui.css">
</head>

<body>

    <div class="sidebar">
        <div class="brand">BharatKart <span>Admin</span></div>

        <a href="dashboard.html" class="menu-item">
            <i class="fa-solid fa-chart-pie"></i> Dashboard
        </a>

        <a href="products.html" class="menu-item">
            <i class="fa-solid fa-box"></i> Products
        </a>

        <a href="orders.html" class="menu-item">
            <i class="fa-solid fa-cart-shopping"></i> Orders
        </a>

        <a href="customers.html" class="menu-item active">
            <i class="fa-solid fa-users"></i> Customers
        </a>

        <button class="logout" id="logoutBtn">Logout</button>
    </div>

    <div class="content">

        <div class="header">
            <h1>Customers</h1>

            <div class="admin-info">
                <h4 id="adminName">Loading...</h4>
                <small class="live">● Live Data</small>
            </div>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search customers by name or email..."
                >
            </div>

            <div class="customer-count" id="customerCount">
                Loading customers...
            </div>

            <button class="refresh-btn" id="refreshBtn">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

        <div class="customer-list" id="customerList">
            <div class="empty">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>Loading customers...</p>
            </div>
        </div>

    </div>

    <!-- CUSTOMER DETAILS -->
    <div class="modal" id="customerModal">
        <div class="modal-box">

            <div class="modal-header">
                <h2>Customer Details</h2>
                <button class="close-btn" id="closeModal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="customerDetails"></div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        import {
            getFirestore,
            doc,
            getDoc,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLCNAA-bbUo2EQfp1EDfGE76b8iSQmCTI",
            authDomain: "bharat-c734b.firebaseapp.com",
            projectId: "bharat-c734b",
            appId: "1:273763763790:web:b2499eff81a4b5b5c3651f"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let customers = [];

        const customerList = document.getElementById("customerList");
        const customerCount = document.getElementById("customerCount");
        const searchInput = document.getElementById("searchInput");

        onAuthStateChanged(auth, async (user) => {

            if (!user) {
                window.location.href = "index.html";
                return;
            }

            try {
                const userDoc = await getDoc(doc(db, "users", user.uid));

                if (!userDoc.exists() || userDoc.data().role !== "admin") {
                    alert("⛔ Access Denied");
                    await signOut(auth);
                    window.location.href = "index.html";
                    return;
                }

                document.getElementById("adminName").innerText = user.email;

                await loadCustomers();

            } catch (error) {
                console.error("Auth Error:", error);
                customerList.innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Unable to load customers.</p>
                        <small>${escapeHtml(error.message)}</small>
                    </div>
                `;
            }
        });

        async function loadCustomers() {

            customerList.innerHTML = `
                <div class="empty">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <p>Loading customers...</p>
                </div>
            `;

            try {
                const snapshot = await getDocs(collection(db, "users"));

                customers = [];

                snapshot.forEach((userDoc) => {
                    const data = userDoc.data();

                    // The admin account is not shown as a customer.
                    if (data.role === "admin") return;

                    customers.push({
                        id: userDoc.id,
                        ...data
                    });
                });

                renderCustomers();

            } catch (error) {
                console.error("Customers Error:", error);

                customerList.innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <p>Error loading customers.</p>
                        <small>${escapeHtml(error.message)}</small>
                    </div>
                `;

                customerCount.innerText = "Unable to load";
            }
        }

        function renderCustomers() {

            const search = searchInput.value.trim().toLowerCase();

            const filtered = customers.filter(customer => {

                const name = getCustomerName(customer).toLowerCase();
                const email = String(customer.email || "").toLowerCase();

                return name.includes(search) || email.includes(search);
            });

            customerCount.innerText =
                `${filtered.length} customer${filtered.length === 1 ? "" : "s"}`;

            if (filtered.length === 0) {
                customerList.innerHTML = `
                    <div class="empty">
                        <i class="fa-solid fa-users"></i>
                        <p>${customers.length === 0
                            ? "No customers found."
                            : "No customers match your search."}</p>
                    </div>
                `;
                return;
            }

            customerList.innerHTML = "";

            filtered.forEach(customer => {

                const name = getCustomerName(customer);
                const email = customer.email || "No email available";
                const phone = customer.phone || customer.mobile || "";

                const card = document.createElement("div");
                card.className = "customer-card";

                card.innerHTML = `
                    <div class="avatar">${escapeHtml(getInitials(name))}</div>

                    <div class="customer-main">
                        <h3>${escapeHtml(name)}</h3>
                        <p><i class="fa-solid fa-envelope"></i> ${escapeHtml(email)}</p>
                        ${phone
                            ? `<p><i class="fa-solid fa-phone"></i> ${escapeHtml(phone)}</p>`
                            : ""}
                        <span class="customer-role">CUSTOMER</span>
                    </div>

                    <button class="view-btn">
                        <i class="fa-solid fa-eye"></i> View
                    </button>
                `;

                card.querySelector(".view-btn").addEventListener("click", () => {
                    showCustomer(customer);
                });

                customerList.appendChild(card);
            });
        }

        function showCustomer(customer) {

            const name = getCustomerName(customer);

            const details = [
                ["Name", name],
                ["Email", customer.email || "Not available"],
                ["Phone", customer.phone || customer.mobile || "Not available"],
                ["User ID", customer.id],
                ["Role", customer.role || "user"]
            ];

            // Show any other fields stored in the user's document.
            Object.keys(customer).forEach(key => {

                if (
                    ["id", "name", "displayName", "fullName",
                     "email", "phone", "mobile", "role"].includes(key)
                ) return;

                const value = customer[key];

                if (
                    value === null ||
                    value === undefined ||
                    typeof value === "object"
                ) return;

                details.push([
                    formatLabel(key),
                    String(value)
                ]);
            });

            document.getElementById("customerDetails").innerHTML =
                details.map(item => `
                    <div class="detail-row">
                        <span class="detail-label">${escapeHtml(item[0])}</span>
                        <div class="detail-value">${escapeHtml(item[1])}</div>
                    </div>
                `).join("");

            document.getElementById("customerModal").classList.add("show");
        }

        function getCustomerName(customer) {
            return (
                customer.name ||
                customer.displayName ||
                customer.fullName ||
                customer.username ||
                customer.email ||
                "Unnamed Customer"
            );
        }

        function getInitials(name) {

            const words = String(name).trim().split(/\s+/);

            if (words.length === 1) {
                return words[0].substring(0, 2).toUpperCase();
            }

            return (
                words[0][0] +
                words[words.length - 1][0]
            ).toUpperCase();
        }

        function formatLabel(text) {
            return String(text)
                .replace(/([A-Z])/g, " $1")
                .replace(/[_-]/g, " ")
                .replace(/^./, char => char.toUpperCase());
        }

        function escapeHtml(value) {
            return String(value)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");
        }

        searchInput.addEventListener("input", renderCustomers);

        document.getElementById("refreshBtn").addEventListener("click", loadCustomers);

        document.getElementById("closeModal").addEventListener("click", () => {
            document.getElementById("customerModal").classList.remove("show");
        });

        document.getElementById("customerModal").addEventListener("click", (event) => {
            if (event.target.id === "customerModal") {
                document.getElementById("customerModal").classList.remove("show");
            }
        });

        document.getElementById("logoutBtn").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "index.html";
        });
    </script>

<script src="../../assets/bharatkart-ui.js"></script>
</body>
</html>
